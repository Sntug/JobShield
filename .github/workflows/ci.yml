name: CI Gatekeeper

on:
  push:
    branches: [main, Tung]
  pull_request:
    branches: [main, Tung]

jobs:
  backend-check:
    name: Backend Pytest & Imports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON_DOWNLOADS: "manual"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pytest
        run: uv run pytest

  frontend-check:
    name: Frontend Typecheck & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Vitest
        run: npm test
