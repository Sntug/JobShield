name: Deployed Preview Smoke

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

jobs:
  installed-checker:
    name: Deployment event routing
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.route.outputs.relevant }}
      revision: ${{ steps.checker.outputs.revision }}
    steps:
      - id: route
        name: Identify a successful Vercel Preview
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          deployment = event.get('deployment') or {}
          status = event.get('deployment_status') or {}
          environment = deployment.get('environment', '').lower()
          relevant = (
              (deployment.get('creator') or {}).get('login') == 'vercel[bot]'
              and status.get('state') == 'success'
              and (environment == 'preview' or environment.startswith('preview '))
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('relevant=' + str(relevant).lower() + '\n')
          PY
      # Never run the PR's checker with secrets. The first rollout uses an audited immutable commit.
      - uses: actions/checkout@v4
        if: steps.route.outputs.relevant == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: checker
        if: steps.route.outputs.relevant == 'true'
        name: Select a trusted checker revision
        run: |
          if [ -f scripts/check-preview.py ]; then
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "revision=0f6e4676b21b5b367d0e8daeab38beaab14c8a4f" >> "$GITHUB_OUTPUT"
            echo "::notice::Using the reviewed bootstrap checker until installation on the default branch."
          fi

  preview-smoke:
    name: ${{ needs.installed-checker.outputs.relevant == 'true' && 'Vercel Preview smoke' || 'Ignored deployment event' }}
    needs: installed-checker
    # Serialize status writers for a commit; Render events use their own deployment group.
    concurrency:
      group: preview-smoke-${{ needs.installed-checker.outputs.relevant == 'true' && github.event.deployment.sha || github.event.deployment.id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Explain unrelated deployment events
        if: needs.installed-checker.outputs.relevant != 'true'
        run: echo "This is not a successful Vercel Preview event. No smoke result is produced."
      - uses: actions/checkout@v4
        if: needs.installed-checker.outputs.relevant == 'true'
        with:
          ref: ${{ needs.installed-checker.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: needs.installed-checker.outputs.relevant == 'true'
        with:
          python-version: '3.13'
      - name: Verify actual frontend to backend to database flow
        env:
          PREVIEW_RELEVANT: ${{ needs.installed-checker.outputs.relevant }}
          PREVIEW_DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 - <<'PY'
          import os, re, runpy, sys
          if os.environ['PREVIEW_RELEVANT'] != 'true':
              sys.exit(0)
          checker = runpy.run_path('scripts/check-preview.py')
          base, sha = checker['deployment_event'](os.environ['GITHUB_EVENT_PATH'])
          repository = os.environ['GITHUB_REPOSITORY']
          deployment_id = int(os.environ['PREVIEW_DEPLOYMENT_ID'])
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          def publish(state):
              # Actions job results from later Render events can hide a failed Vercel run.
              try:
                  headers = {'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN']}
                  code, combined, _ = checker['request_json']('https://api.github.com',
                      f'/repos/{repository}/commits/{sha}/status?per_page=100', headers=headers)
                  if code != 200 or not isinstance(combined.get('statuses'), list):
                      raise ValueError('Cannot read current commit statuses')
                  previous = next((item for item in combined['statuses']
                      if item.get('context') == 'JobShield / Preview smoke'), None)
                  if previous:
                      match = re.fullmatch(r'Preview deployment ([0-9]+): (pending|success|failure)', previous.get('description') or '')
                      if not match:
                          raise ValueError('Unrecognized Preview status')
                      if int(match[1]) > deployment_id:
                          print('::notice::A newer deployment owns the Preview smoke status.')
                          return False
                  elif len(combined['statuses']) >= 100:
                      raise ValueError('Cannot determine latest Preview status from one page')
                  status, _, _ = checker['request_json']('https://api.github.com',
                      f'/repos/{repository}/statuses/{sha}', 'POST', {
                          'state': state, 'context': 'JobShield / Preview smoke',
                          'target_url': run_url, 'description': f'Preview deployment {deployment_id}: {state}',
                      }, headers=headers)
                  if status != 201:
                      raise ValueError('Commit status rejected')
                  return True
              except Exception:
                  raise SystemExit('Cannot publish Preview smoke commit status.') from None

          if not publish('pending'):
              sys.exit(0)
          sys.argv = ['check-preview.py', '--url', base, '--sha', sha]
          try:
              checker['main']()
          except (Exception, SystemExit):
              publish('failure')
              raise
          else:
              publish('success')
          PY
