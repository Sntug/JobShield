[project]
name = "jobshield-backend"
version = "0.1.0"
description = "Môi trường backend JobShield"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false
python-downloads = "manual"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
